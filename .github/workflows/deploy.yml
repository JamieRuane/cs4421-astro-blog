name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Validate security policy
        run: npm run security:validate

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "Repository variable AWS_DEPLOY_ROLE_ARN must reference the GitHub OIDC deployment role."
            exit 1
          fi

      - name: Synthesize deployment stack
        run: npx cdk synth StaticSiteStack --strict

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy with AWS CDK
        run: npx cdk deploy StaticSiteStack --require-approval never

      - name: Get CloudFront URL
        id: cloudfront
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name StaticSiteStack \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text)

          echo "CloudFront URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          SITE_URL: ${{ steps.cloudfront.outputs.url }}
        run: |
          check_json_status() {
            local url="$1"
            local expected_status="$2"
            local response=""

            for attempt in {1..10}; do
              response=$(curl --silent --show-error --fail "$url") && break
              echo "Health check attempt $attempt failed for $url. Retrying..."
              sleep 10
            done

            if [ -z "$response" ]; then
              echo "Health check failed for $url"
              return 1
            fi

            actual_status=$(echo "$response" | jq -r '.status')
            if [ "$actual_status" != "$expected_status" ]; then
              echo "Unexpected status from $url: $actual_status"
              return 1
            fi
          }

          check_json_status "$SITE_URL/health.json" "healthy"
          check_json_status "$SITE_URL/api/health" "ok"

      - name: Validate deployed security headers
        env:
          SITE_URL: ${{ steps.cloudfront.outputs.url }}
        run: |
          check_security_headers() {
            local url="$1"
            local headers
            headers=$(curl --silent --show-error --fail --dump-header - --output /dev/null "$url")

            for header in \
              "content-security-policy:.*default-src 'self'" \
              "x-content-type-options: nosniff" \
              "x-frame-options: DENY" \
              "referrer-policy: strict-origin-when-cross-origin" \
              "permissions-policy: camera=\\(\\), geolocation=\\(\\), microphone=\\(\\)" \
              "strict-transport-security: max-age=31536000"; do
              if ! echo "$headers" | grep -Eiq "^$header"; then
                echo "Expected deployed security header was missing from $url: $header"
                return 1
              fi
            done
          }

          check_security_headers "$SITE_URL/"
          check_security_headers "$SITE_URL/api/health"

          echo "Deployed security headers are present."