name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy with AWS CDK
        run: npx cdk deploy StaticSiteStack --require-approval never

      - name: Get CloudFront URL
        id: cloudfront
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name StaticSiteStack \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text)

          echo "CloudFront URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          HEALTH_URL: ${{ steps.cloudfront.outputs.url }}/health.json
        run: |
          echo "Checking $HEALTH_URL"

          for i in {1..10}; do
            RESPONSE=$(curl --silent --show-error --fail "$HEALTH_URL") && break

            echo "Health check attempt $i failed. Retrying..."
            sleep 10
          done

          if [ -z "$RESPONSE" ]; then
            echo "Health check failed"
            exit 1
          fi

          echo "Response: $RESPONSE"

          STATUS=$(echo "$RESPONSE" | jq -r '.status')

          if [ "$STATUS" != "healthy" ]; then
            echo "Health endpoint returned an unexpected status: $STATUS"
            exit 1
          fi

          echo "Health check passed"